<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ info.titulo }} - Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        <span class="badge {{ info.clase_badge }}">{{ info.badge }}</span>
        <h2>{{ info.titulo }}</h2>
        <p class="subtitulo">Ingresa tus datos para acceder a la evaluación</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login_video', tipo_video=tipo) }}">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required autocomplete="off">
            </div>
            <button type="submit" class="btn-ingresar">Ingresar a la Evaluación</button>
        </form>
    </div>
</body>
</html>
