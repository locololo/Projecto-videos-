<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ video_info.titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="video-container">
        <header class="video-header">
            <span class="badge {{ video_info.clase_badge }}">{{ video_info.badge }}</span>
            <h2>{{ video_info.titulo }}</h2>
            <p>Por favor, observa el video con atención. No podrás pausar, adelantar ni retroceder.</p>
        </header>

        <div class="video-wrapper">
            <div id="capa-inicio" class="capa-inicio">
                <button id="btn-play" class="btn-play-gigante">&#9654; COMENZAR VIDEO</button>
            </div>
            <video id="reproductor" src="{{ video_info.url }}" preload="auto" playsinline></video>
        </div>

        <div id="cartel-final" class="cartel-final hidden">
            <div class="cartel-contenido">
                <div class="icono-completado">&#128203;</div>
                <h3>¡Video Completado!</h3>
                <p>Has finalizado la visualización. Ya puedes volver a la pestaña del formulario para continuar.</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
